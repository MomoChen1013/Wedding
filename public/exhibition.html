<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 社群預覽文字：爬蟲不跑 JS，一律用不帶樣板的通用文案（見 index.html 的說明） -->
<title>我們的故事｜婚禮邀請函</title>
<meta name="description" content="沿著時間軸走一趟，看看這對新人一路走來的故事">
<meta property="og:title" content="我們的故事｜婚禮邀請函">
<meta property="og:description" content="沿著時間軸走一趟，看看這對新人一路走來的故事">
<meta property="og:type" content="website">

<link rel="icon" href="/favicon.png" type="image/png">
<!-- iOS「加到主畫面」用的圖示。同一張 512×512，iOS 會自己縮 -->
<link rel="apple-touch-icon" href="/favicon.png">
<!-- ============ 載入順序 ============
     下面這幾行不改變任何行為，只是把「瀏覽器什麼時候開始下載」往前挪。

     ・preconnect：Firebase SDK 在 www.gstatic.com、資料在 firestore.googleapis.com，
       都是**全新的網域**，各要一次 DNS + TLS 握手。不先連好的話，
       這兩次握手是卡在關鍵路徑上的。
     ・modulepreload：site-context.js 是 type="module"，預設要等 HTML 解析完
       才會開始抓，它 import 的三支 Firebase SDK 更要再等一輪。
       先宣告之後，它們會跟 CSS 平行下載。
     ・preload as="script"：common.js 與本頁的 JS 是資料到齊之後才被注入的，
       不先宣告的話那是兩個接在最後面的來回。這裡只是先下載，
       執行順序仍然由 site-context.js 決定（它要等站台設定）。

     版號要跟 js/site-context.js 的 import 一致，
     tests/ui-consistency.mjs 有一條在守這件事。 -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="/js/site-context.js">
<link rel="modulepreload" href="/js/wed-model.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js" crossorigin>
<link rel="preload" as="script" href="/js/common.js">
<link rel="preload" as="script" href="/js/exhibition.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/exhibition.css">
</head>
<body data-template="classic" data-page="exhibition">
<!-- 開場遮罩：只有**沒預產到**的頁面會顯示（見 css/common.css 的 .boot-veil）。
     那種頁面的版型要等 Firestore 回來才換得掉，換色就發生在這一層底下。
     build-og 產出的頁面會在 <html> 上蓋 data-prerendered，這層直接不顯示。 -->
<div class="boot-veil" aria-hidden="true"><span class="boot-veil-mark">✦</span></div>


<div class="bg-decor"></div>
<canvas id="fx"></canvas>

<div class="scene-bg" data-bg="gallery"></div>

<!-- 頂部全頁進度條 -->
<div class="tl-topbar" id="tlTopbar"></div>

<section class="panel page-fade" data-panel="exhibition">

  <!-- 入口封面 -->
  <div class="scene-hero">
    <div class="sh-title">我們的故事</div>
    <div class="sh-sub">沿著時間線・走過我們的戀愛旅程</div>
    <div class="scroll-cue"><span>Scroll</span><span class="arrow"></span></div>
  </div>

  <!-- 橫向時間軸：手機直接用手指左右滑，桌機可以拖曳、按左右鍵或點兩側的箭頭 -->
  <section class="tl-sec" id="tlSec">
    <div class="tl-pin">
      <div class="tl-year-back" id="tlYearBack">2021</div>
      <div class="tl-head">
        <div class="tl-eyebrow">左右滑動看展覽</div>
        <h2>Our Love Timeline</h2>
      </div>

      <!-- 時間線：留在軌道外面，才不會跟著橫向捲動跑掉 -->
      <div class="tl-rail"></div>

      <div class="tl-track" id="tlTrack">
        <!-- 節點由 js/exhibition.js 動態建立 -->
      </div>

      <!-- 桌機用的左右箭頭（手機隱藏，直接滑就好） -->
      <button class="tl-arrow prev" id="tlPrev" type="button" aria-label="上一張">‹</button>
      <button class="tl-arrow next" id="tlNext" type="button" aria-label="下一張">›</button>

      <div class="tl-progress" id="tlDots"></div>
    </div>
  </section>

  <!-- 後續區塊 -->
  <div class="scene-body">
    <footer>made for <span data-tpl="couple"></span><span class="tpl-sep" data-tpl="hashtag"></span></footer>
  </div>
</section>

<!-- lightbox -->
<div class="lb" id="lb">
  <div class="lb-card">
    <button class="lb-close" id="lbClose">✕</button>
    <div class="ph" id="lbPh"></div>
    <div class="lb-body">
      <div class="lb-date" id="lbDate"></div>
      <div class="t" id="lbT">標題</div>
      <p class="lb-desc" id="lbDesc"></p>
    </div>
  </div>
</div>

<!-- 故事牆的預設故事與章節（與後台共用同一份） -->
<script defer src="/js/exhibit-defaults.js"></script>

<!-- 站台載入器：解析 slug、載設定，之後才注入 common.js 與本頁 JS -->
<script type="module" src="/js/site-context.js"></script>
</body>
</html>
