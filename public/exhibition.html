<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我們的故事｜{{couple}} 婚禮</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/exhibition.css">
</head>
<body data-theme="champagne" data-page="exhibition">

<div class="bg-decor"></div>
<canvas id="fx"></canvas>

<div class="scene-bg" data-bg="gallery"></div>

<!-- 頂部全頁進度條 -->
<div class="tl-topbar" id="tlTopbar"></div>

<section class="panel page-fade" data-panel="exhibition">

  <!-- 入口封面 -->
  <div class="scene-hero">
    <div class="sh-title">我們的故事</div>
    <div class="sh-sub">沿著時間線・走過我們的戀愛旅程</div>
    <div class="scroll-cue"><span>Scroll</span><span class="arrow"></span></div>
  </div>

  <!-- 橫向時間軸 -->
  <section class="tl-sec" id="tlSec">
    <div class="tl-pin">
      <div class="tl-year-back" id="tlYearBack">2021</div>
      <div class="tl-head">
        <div class="tl-eyebrow">上下滑動來看展覽</div>
        <h2>Our Love Timeline</h2>
      </div>

      <div class="tl-track" id="tlTrack">
        <div class="tl-rail"></div>
        <!-- 節點由 js/exhibition.js 動態建立 -->
      </div>

      <div class="tl-progress" id="tlDots"></div>
    </div>
  </section>

  <!-- 後續區塊 -->
  <div class="scene-body">
    <footer>made for {{couple}}・{{hashtag}}</footer>
  </div>
</section>

<!-- lightbox -->
<div class="lb" id="lb">
  <div class="lb-card">
    <button class="lb-close" id="lbClose">✕</button>
    <div class="ph" id="lbPh"></div>
    <div class="lb-body">
      <div class="lb-date" id="lbDate"></div>
      <div class="t" id="lbT">標題</div>
      <p class="lb-desc" id="lbDesc"></p>
    </div>
  </div>
</div>

<!-- 站台載入器：解析 slug、載設定，之後才注入 common.js 與本頁 JS -->
<script type="module" src="/js/site-context.js"></script>
</body>
</html>
