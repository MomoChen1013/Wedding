<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 社群預覽文字：爬蟲不跑 JS，一律用不帶樣板的通用文案（見 index.html 的說明） -->
<title>集氣送祝福｜婚禮邀請函</title>
<meta name="description" content="一起把祝福集滿，替新人送上今天的甜點">
<meta property="og:title" content="集氣送祝福｜婚禮邀請函">
<meta property="og:description" content="一起把祝福集滿，替新人送上今天的甜點">
<meta property="og:type" content="website">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/cake.css">
</head>
<body data-theme="champagne" data-page="cake">

<div class="bg-decor"></div>
<canvas id="fx"></canvas>

<div class="scene-bg" data-bg="cake"></div>

<section class="panel page-fade" data-panel="cake">
  <div class="scene-hero">
    <div class="sh-title">集氣送祝褔</div>
    <div class="sh-sub">挑一份甜點・獻上你對新人的祝福</div>
    <div class="scroll-cue"><span>Scroll</span><span class="arrow"></span></div>
  </div>

  <div class="scene-body">

    <!-- ===== 上方：收集桶（Matter.js 物理） ===== -->
    <div class="cardbox cake-bucket">
      <div class="section-title">甜點祝福箱 <small>已收到 <b id="bucketCount">0</b> 份甜點</small></div>
      <div class="bucket-lid"></div>
      <div class="bucket-body" id="bucketBody">
        <div class="bucket-empty">甜點桌是空的，第一個送上祝福的就是你</div>
      </div>
      <p class="bucket-tip">點甜點，看看是誰送的</p>
    </div>

    <div class="divider-div"></div>

    <!-- ===== 下方：慶祝儀式舞台 ===== -->
    <div class="cardbox ritual-card">
      <!-- 蛋糕台（pick → drop 共用） -->
      <div class="ritual-plate" id="ritualPlate" hidden>
        <div class="cake-plate cake-plate-static">
          <div class="flame out" id="flame" title="點我吹熄、許願"></div>
          <div class="candle"></div>
          <div class="slice" id="slicePhoto"><span class="slice-ph"></span></div>
          <div class="plate-base"></div>
        </div>
        <div class="cake-name" id="cakeName">香草千層蛋糕</div>
        <div class="wish-line" id="wishLine"></div>
      </div>

      <!-- 每一步的指引 -->
      <div class="step-pane active" data-step="idle">
        <h3>準備好獻上祝福了嗎？</h3>
        <p class="step-hint">依序：選甜點 → 點蠟燭 → 放煙火 → 送上桌</p>
        <button class="btn" id="startBtn">開始集氣</button>
      </div>

      <div class="step-pane" data-step="pick">
        <h3>一・挑一份甜點送新人</h3>
        <p class="step-hint">點下方選項挑你想送的甜點</p>
        <div class="cake-picker" id="cakePicker"></div>
        <button class="btn small" id="toBlowBtn">下一步：點蠟燭</button>
      </div>

      <div class="step-pane" data-step="blow">
        <h3>二・點火苗吹熄蠟燭</h3>
        <p class="step-hint">點蠟燭上的小火苗，為新人獻上祝福</p>
      </div>

      <div class="step-pane" data-step="party">
        <h3>三・慶祝煙火</h3>
        <p class="step-hint">煙火金箔灑落中…</p>
      </div>

      <div class="step-pane" data-step="drop">
        <h3>四・甜點送上桌中…</h3>
        <p class="step-hint">記下「<b id="senderPreview">朋友</b>」送了這份甜點</p>
      </div>

      <div class="step-pane" data-step="done">
        <h3>甜點送出</h3>
        <p class="step-hint">新人之後會看到「<b id="senderName">朋友</b>」送了一份「<b id="senderCake">甜點</b>」</p>
        <button class="btn ghost small" id="againBtn">再送一份</button>
      </div>
    </div>

    <footer>made for {{couple}}・{{hashtag}}</footer>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<!-- 站台載入器：解析 slug、載設定，之後才注入 common.js 與本頁 JS -->
<script type="module" src="/js/site-context.js"></script>
</body>
</html>
