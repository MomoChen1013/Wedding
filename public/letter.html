<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 社群預覽文字：爬蟲不跑 JS，一律用不帶樣板的通用文案（見 index.html 的說明） -->
<title>給你的信｜婚禮邀請函</title>
<meta name="description" content="新人寫了一封信，正在這裡等您來領">
<meta property="og:title" content="給你的信｜婚禮邀請函">
<meta property="og:description" content="新人寫了一封信，正在這裡等您來領">
<meta property="og:type" content="website">

<link rel="icon" href="/favicon.png" type="image/png">
<!-- iOS「加到主畫面」用的圖示。同一張 512×512，iOS 會自己縮 -->
<link rel="apple-touch-icon" href="/favicon.png">
<!-- ============ 載入順序 ============
     下面這幾行不改變任何行為，只是把「瀏覽器什麼時候開始下載」往前挪。

     ・preconnect：Firebase SDK 在 www.gstatic.com、資料在 firestore.googleapis.com，
       都是**全新的網域**，各要一次 DNS + TLS 握手。不先連好的話，
       這兩次握手是卡在關鍵路徑上的。
     ・modulepreload：site-context.js 是 type="module"，預設要等 HTML 解析完
       才會開始抓，它 import 的三支 Firebase SDK 更要再等一輪。
       先宣告之後，它們會跟 CSS 平行下載。
     ・preload as="script"：common.js 與本頁的 JS 是資料到齊之後才被注入的，
       不先宣告的話那是兩個接在最後面的來回。這裡只是先下載，
       執行順序仍然由 site-context.js 決定（它要等站台設定）。

     版號要跟 js/site-context.js 的 import 一致，
     tests/ui-consistency.mjs 有一條在守這件事。 -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="/js/site-context.js">
<link rel="modulepreload" href="/js/wed-model.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js" crossorigin>
<link rel="preload" as="script" href="/js/common.js">
<link rel="preload" as="script" href="/js/letter.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 內文用的手寫字體（霞鶩文楷 TC）：只有這一頁載，其他頁沿用明體 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&family=LXGW+WenKai+TC:wght@400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/letter.css">
</head>
<body data-template="classic" data-page="letter">
<!-- 開場遮罩：只有**沒預產到**的頁面會顯示（見 css/common.css 的 .boot-veil）。
     那種頁面的版型要等 Firestore 回來才換得掉，換色就發生在這一層底下。
     build-og 產出的頁面會在 <html> 上蓋 data-prerendered，這層直接不顯示。 -->
<div class="boot-veil" aria-hidden="true"><span class="boot-veil-mark">✦</span></div>


<div class="bg-decor"></div>
<canvas id="fx"></canvas>

<div class="scene-bg" data-bg="gallery"></div>

<section class="panel page-fade" data-panel="letter">

  <div class="scene-hero">
    <div class="sh-title">給你的信</div>
    <div class="sh-sub"><span data-tpl="couple"></span> 寫了一封信・在等你來領</div>
  </div>

  <div class="scene-body wl-body">

    <!-- ===== 信封（尚未開啟） ===== -->
    <div class="wl-stage" id="wlStage">
      <div class="envelope" id="wlEnvelope">
        <div class="env-back"></div>
        <div class="env-paper"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="env-seal" id="wlSeal">
          <span class="env-seal-mark">&amp;</span>
        </div>
        <div class="env-to">
          <span class="env-to-label">To</span>
          <span class="env-to-name" id="wlToName">你</span>
        </div>
      </div>

      <form class="wl-form" id="wlForm" autocomplete="off">
        <label class="wl-label" for="wlInput">輸入你的名字，或新人給你的專屬暗號</label>
        <div class="wl-row">
          <input class="wl-input" id="wlInput" type="text" maxlength="40"
                 placeholder="例如：王小明">
          <button class="btn small" id="wlBtn" type="submit">開信</button>
        </div>
        <div class="wl-msg" id="wlMsg" aria-live="polite">&nbsp;</div>
      </form>
    </div>

    <!-- ===== 信紙（開啟後） ===== -->
    <article class="wl-sheet" id="wlSheet" hidden>
      <div class="wl-sheet-inner">
        <div class="wl-sheet-head">
          <span class="wl-sheet-rule"></span>
          <span class="wl-sheet-mark">✦</span>
          <span class="wl-sheet-rule"></span>
        </div>
        <h2 class="wl-title" id="wlTitle"></h2>
        <p class="wl-text" id="wlText"></p>
        <div class="wl-sign">
          <div class="wl-sign-from">from</div>
          <div class="wl-sign-name" id="wlSign"></div>
        </div>
      </div>
      <div class="wl-sheet-actions">
        <button class="btn small" id="wlSave" type="button">儲存下載</button>
        <button class="btn small ghost" id="wlAgain" type="button">換一個名字再試</button>
        <div class="wl-save-hint" id="wlSaveHint" aria-live="polite">存成 JPG 圖片，收進手機或電腦相簿</div>
      </div>
    </article>

    <footer>made for <span data-tpl="couple"></span><span class="tpl-sep" data-tpl="hashtag"></span></footer>
  </div>
</section>

<!-- 站台載入器：解析 slug、載設定，之後才注入 common.js 與本頁 JS -->
<script type="module" src="/js/site-context.js"></script>
</body>
</html>
