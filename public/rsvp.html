<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 社群預覽文字：爬蟲不跑 JS，一律用不帶樣板的通用文案（見 index.html 的說明） -->
<title>出席回覆｜婚禮邀請函</title>
<meta name="description" content="告訴新人您能不能到場，讓他們把每一個位子都安排好">
<meta property="og:title" content="出席回覆｜婚禮邀請函">
<meta property="og:description" content="告訴新人您能不能到場，讓他們把每一個位子都安排好">
<meta property="og:type" content="website">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/rsvp.css">
</head>
<body data-theme="champagne" data-page="rsvp">

<div class="bg-decor"></div>
<canvas id="fx"></canvas>

<section class="panel page-fade" data-panel="rsvp">
  <div class="scene-hero">
    <div class="sh-title">出席回覆</div>
    <div class="sh-sub">請告訴我們你能不能來・讓我們預留位置</div>
    <div class="scroll-cue"><span>Scroll</span><span class="arrow"></span></div>
  </div>

  <div class="scene-body">

    <!-- 統計 -->
    <div class="rsvp-counter">
      <div>
        <div class="rc-line">已收到 <b id="rsvpCount">0</b> 份回覆・預計 <b id="attendCount">0</b> 位出席</div>
        <div class="rc-hint">每位賓客回覆一次就好，之後可再修改</div>
      </div>
    </div>

    <!-- 表單 -->
    <div class="cardbox" id="formCard">
      <div class="section-title">你的出席回覆</div>

      <label class="rf-label">怎麼稱呼你？</label>
      <div class="field"><input id="rName" type="text" maxlength="20" placeholder="輸入你的名字"></div>

      <label class="rf-label">能來參加嗎？</label>
      <div class="choice-row" id="attendRow">
        <button type="button" class="choice" data-val="yes">我會出席</button>
        <button type="button" class="choice" data-val="no">不克出席</button>
        <button type="button" class="choice" data-val="maybe">還不確定</button>
      </div>

      <!-- 出席才要填的細節 -->
      <div class="rf-detail" id="detailBox" hidden>
        <label class="rf-label">包含你，共幾位出席？</label>
        <div class="stepper">
          <button type="button" class="st-btn" id="minusBtn">−</button>
          <span class="st-num" id="headNum">1</span>
          <button type="button" class="st-btn" id="plusBtn">＋</button>
          <span class="st-unit">位</span>
        </div>

        <label class="rf-label">餐點需求</label>
        <div class="choice-row" id="mealRow">
          <button type="button" class="choice sm" data-val="meat">葷食</button>
          <button type="button" class="choice sm" data-val="veg">素食</button>
          <button type="button" class="choice sm" data-val="none">不用餐</button>
        </div>
      </div>

      <label class="rf-label">想對新人說的話 <small>（選填）</small></label>
      <div class="field"><textarea id="rNote" maxlength="200" placeholder="給 {{couple}} 的悄悄話…"></textarea></div>

      <div class="rf-err" id="rErr">&nbsp;</div>
      <button class="btn" id="submitBtn">送出回覆</button>
    </div>

    <!-- 送出後的感謝畫面 -->
    <div class="cardbox thanks-card" id="thanksCard" hidden>
      <h3 id="tkTitle">收到你的回覆囉</h3>
      <p id="tkMsg">謝謝你，我們超期待與你相見</p>
      <button class="btn ghost small" id="editBtn">修改我的回覆</button>
    </div>

    <!-- 新人專屬：完整名單（網址加 #couple 才出現） -->
    <div class="cardbox owner-list" id="ownerList" hidden>
      <div class="section-title">出席名單 <small>只有新人看得到</small></div>
      <div class="ol-summary" id="olSummary"></div>
      <div class="ol-items" id="olItems"></div>
    </div>

    <footer>made for {{couple}}・{{hashtag}}</footer>
  </div>
</section>

<!-- 站台載入器：解析 slug、載設定，之後才注入 common.js 與本頁 JS -->
<script type="module" src="/js/site-context.js"></script>
</body>
</html>
