<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 祝福牆｜{{couple}} 婚禮</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/wall.css">
</head>
<body data-theme="champagne" data-page="wall">

<div class="bg-decor"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="fx"></canvas>

<div class="scene-bg" data-bg="wishes"></div>

<div class="me-mini" id="meMini"><span class="ic">💍</span><span class="nm">朋友</span></div>

<section class="panel page-fade" data-panel="wall">
  <div class="scene-hero">
    <div class="sh-title">💌 給新人的祝福</div>
    <div class="sh-sub">留言、寫信，把祝福送給 {{couple}}</div>
    <div class="scroll-cue"><span>向下探索</span><span class="arrow">↓</span></div>
  </div>

  <div class="scene-body">

    <!-- 簽到祝福留言牆 -->
    <div class="cardbox">
      <div class="section-title" ><span class="em">♡</span> 祝福留言牆 <small>大家都看得到</small></div>
      <div class="wish-form">
        <textarea id="wishText" placeholder="寫下想對新人說的話…"></textarea>
        <div style="text-align:right;margin-top:10px">
          <button class="btn small" id="postWish">貼上祝福 ♡</button>
        </div>
      </div>
      <div class="wish-wall" id="wishWall"></div>
    </div>
   <div class="divider-div"></div>
    <!-- 信箱 -->
  <div class="cardbox">
       <div class="section-title" id="mailboxSection"><span class="em">♡</span> 悄悄話信箱 <small>只有新人看得到</small></div>
      <div class="mailbox-wrap">
        <div class="mailbox" id="mailbox" title="寫一封信">📮</div>
        <div class="mailbox-count">已有 <b id="letterCount">0</b> 封信飛進新人的信箱</div>
        <button class="btn small ghost" id="writeLetter">✉️ 寫一封信</button>
      </div>
    </div>

    <footer>made with ♡ for {{couple}}・{{hashtag}}</footer>
  </div>
</section>

<!-- 悄悄話信件彈窗 -->
<div class="letter-modal" id="letterModal">
  <div class="letter-card">
    <div class="wax-seal" aria-hidden="true"><span>&amp;</span></div>
    <button class="letter-close" id="letterClose">✕</button>
    <h3>💌 給新人的悄悄話</h3>
    <div class="ltip">只有新人看得到・寫完投進信箱</div>
    <textarea id="letterText" placeholder="親愛的 {{couple}}…"></textarea>
    <div class="letter-actions">
      <button class="btn ghost small" id="letterCancel">取消</button>
      <button class="btn small"        id="letterSend">投進信箱 ✉️</button>
    </div>
  </div>
</div>

<a class="back-lobby show" href="index.html">回到大廳</a>
<a class="turn-nav show" id="turnLeft"  href="quiz.html"><span class="tn-arrow">←</span><span class="tn-label">💗小測驗</span></a>
<a class="turn-nav show" id="turnRight" href="cake.html"><span class="tn-arrow">→</span><span class="tn-label">🎂蛋糕櫃</span></a>



<div class="floating">
  <div class="theme-pop" id="themePop">
    <div class="theme-dot t-champagne" data-theme="champagne" title="香檳金"></div>
    <div class="theme-dot t-blush"   data-theme="blush"   title="霧玫瑰"></div>
    <div class="theme-dot t-sage"      data-theme="sage"      title="鼠尾草綠"></div>
    <div class="theme-dot t-dusk"   data-theme="dusk"   title="霧霾藍"></div>
  </div>
  <button class="fab" id="themeFab" title="換主題色">🎨</button>
  <button class="fab" id="bgmFab"   title="婚禮進行曲">🔇</button>
</div>

<!-- 站台載入器：解析 slug、載設定，之後才注入 common.js 與本頁 JS -->
<script type="module" src="/js/site-context.js"></script>
</body>
</html>
