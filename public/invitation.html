<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 社群預覽文字：爬蟲不跑 JS，一律用不帶樣板的通用文案（見 index.html 的說明）。
     每個站台專屬的那一份由 scripts/build-og.js 產到 public/w/{slug}/invitation.html，
     改了下面幾行要重跑 npm run build-og。 -->
<title>婚禮邀請函</title>
<meta name="description" content="誠摯邀請您一起見證我們的大喜之日・時間、地點與出席回覆都在這裡">
<meta property="og:title" content="婚禮邀請函｜我們結婚了">
<meta property="og:description" content="誠摯邀請您一起見證我們的大喜之日・時間、地點與出席回覆都在這裡">
<meta property="og:type" content="website">

<link rel="icon" href="/favicon.png" type="image/png">
<!-- iOS「加到主畫面」用的圖示。同一張 512×512，iOS 會自己縮 -->
<link rel="apple-touch-icon" href="/favicon.png">
<!-- 字體：全站單一字族 Noto Serif TC -->
<!-- ============ 載入順序 ============
     下面這幾行不改變任何行為，只是把「瀏覽器什麼時候開始下載」往前挪。

     ・preconnect：Firebase SDK 在 www.gstatic.com、資料在 firestore.googleapis.com，
       都是**全新的網域**，各要一次 DNS + TLS 握手。不先連好的話，
       這兩次握手是卡在關鍵路徑上的。
     ・modulepreload：site-context.js 是 type="module"，預設要等 HTML 解析完
       才會開始抓，它 import 的三支 Firebase SDK 更要再等一輪。
       先宣告之後，它們會跟 CSS 平行下載。
     ・preload as="script"：common.js 與本頁的 JS 是資料到齊之後才被注入的，
       不先宣告的話那是兩個接在最後面的來回。這裡只是先下載，
       執行順序仍然由 site-context.js 決定（它要等站台設定）。

     版號要跟 js/site-context.js 的 import 一致，
     tests/ui-consistency.mjs 有一條在守這件事。 -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="/js/site-context.js">
<link rel="modulepreload" href="/js/wed-model.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js" crossorigin>
<link rel="preload" as="script" href="/js/common.js">
<link rel="preload" as="script" href="/js/invitation.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/rsvp.css">
<link rel="stylesheet" href="/css/invitation.css">
</head>
<body data-template="classic" data-page="rsvp">
<!-- 開場遮罩：只有**沒預產到**的頁面會顯示（見 css/common.css 的 .boot-veil）。
     那種頁面的版型要等 Firestore 回來才換得掉，換色就發生在這一層底下。
     build-og 產出的頁面會在 <html> 上蓋 data-prerendered，這層直接不顯示。 -->
<div class="boot-veil" aria-hidden="true"><span class="boot-veil-mark">✦</span></div>


<div class="bg-decor"></div>
<canvas id="fx"></canvas>

<div class="scene-bg" data-bg="gallery"></div>

<section class="panel page-fade" data-panel="rsvp">

  <!-- ============ 封面 ============ -->
  <header class="scene-hero inv-hero">
    <div class="inv-kicker">We're getting married</div>
    <h1 class="sh-title inv-couple" data-tpl="couple"></h1>
    <div class="sh-rule"></div>
    <div class="sh-sub" id="invDate" data-tpl="date"></div>
    <div class="inv-countdown" id="invCountdown" data-sk="text"></div>
    <div class="scroll-cue"><span>Scroll</span><span class="arrow"></span></div>
  </header>

  <div class="scene-body">

    <!-- ============ 出席回覆 ============
         這一頁從表單開始，不再重講一次婚禮資訊、兩人的故事與「相遇之間」。
         拿到這個連結的人是「要回覆出席」的人 —— 那幾塊在大廳都有，
         擺在表單前面只會把真正要做的事往下推。
         想看的人從送出後的結果卡就進得去（見 js/rsvp-form.js 的 tkActs）。 -->
    <section class="inv-block" id="rsvpBlock">
      <div class="section-title">R.S.V.P. <small>出席回覆</small></div>
      <p class="inv-lead">花一分鐘告訴我們你的安排，讓我們把每個細節都準備好</p>
      <!-- 題目由 js/rsvp-form.js 依新人在後台的設定產生 -->
      <div id="rsvpFormHost"></div>
    </section>

    <!-- ============ hashtag（沒設定就用預設兩個） ============ -->
    <section class="inv-block" id="tagBlock">
      <div class="inv-tags" id="hashtags"></div>
    </section>

    <footer>made for <span data-tpl="couple"></span>・小港製作所 設計製作</footer>
  </div>
</section>

<!-- 出席回覆表單：先定義好，等 site-context 載完頁面 JS 才會呼叫 -->
<script src="/js/rsvp-form.js"></script>
<!-- 站台載入器：解析 slug、載設定，之後才注入 common.js 與本頁 JS -->
<script type="module" src="/js/site-context.js"></script>
</body>
</html>
