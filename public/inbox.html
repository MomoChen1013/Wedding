<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 隱藏頁面：請勿從其他頁面連結至此 / Do not link here from anywhere -->
<meta name="robots" content="noindex,nofollow">
<title>Inbox</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/inbox.css">
</head>
<body data-theme="champagne" data-page="inbox">

<div class="bg-decor"></div>
<canvas id="fx"></canvas>

<!-- ============ 登入門 ============ -->
<div class="overlay" id="pwGate">
  <div class="gate-card">
    <div class="ribbon">Private</div>
    <h1>新人信箱</h1>
    <div class="sub">這是 {{couple}} 專屬的悄悄話信箱<br>請用新人的 Google 帳號登入</div>
    <button class="btn btn-google" id="ownerLoginBtn" type="button">
      <svg viewBox="0 0 18 18" aria-hidden="true" width="18" height="18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      用 Google 帳號登入
    </button>
    <div class="pw-err" id="pwErr">&nbsp;</div>
    <div class="sub" style="margin-top:14px;font-size:.82rem;opacity:.7">
      只有新人本人的帳號讀得到信件內容
    </div>
  </div>
</div>

<!-- ============ 信箱本體（解鎖後顯示） ============ -->
<section class="panel page-fade" data-panel="inbox" id="inboxPage" hidden>
  <div class="scene-hero inbox-hero">
    <div class="sh-title">新人信箱</div>
    <div class="sh-sub">賓客們寄給你們的悄悄話，全部都在這裡</div>
    <div class="scroll-cue"><span>Scroll</span><span class="arrow"></span></div>
  </div>

  <div class="scene-body">
    <div class="ib-counter">
      <div>
        <div class="ib-counter-num"><b id="ibCount">0</b> 封悄悄話</div>
        <div class="ib-counter-hint">賓客寫給新人的悄悄話・只有你們看得到</div>
      </div>
      <button class="ib-lock" id="ibLock" type="button" title="鎖回信箱" aria-label="鎖回信箱">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4.5" y="10.5" width="15" height="10"/>
          <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
        </svg>
      </button>
    </div>

    <div class="inbox-page-list" id="ibList"></div>

    <footer>made for {{couple}}・{{hashtag}}</footer>
  </div>
</section>

<!-- 站台載入器：解析 slug、載設定，之後才注入 common.js 與本頁 JS -->
<script type="module" src="/js/site-context.js"></script>
</body>
</html>
