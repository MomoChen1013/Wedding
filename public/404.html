<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找不到頁面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* 通用 404：Hosting 找不到檔案時顯示 */
:root{
  --theme:#3D9AD1;
  --accent:#E8A93C;
  --ink:#2B2F36;
  --ink-soft:#5C646F;
  --paper:#FBFAF8;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:40px 24px;text-align:center;
  background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","Zen Kaku Gothic New",sans-serif;
  font-weight:300;line-height:1.9;letter-spacing:.04em;
  -webkit-font-smoothing:antialiased;
}
.mark{font-size:2.6rem;line-height:1;color:var(--accent)}
.code{
  font-family:"Archivo",sans-serif;font-size:.72rem;
  letter-spacing:.24em;color:var(--theme);margin:0;
}
h1{font-size:1.35rem;font-weight:500;margin:6px 0 0}
p{color:var(--ink-soft);font-size:.94rem;margin:0;max-width:34ch}
footer{
  font-family:"Archivo",sans-serif;font-size:.72rem;letter-spacing:.2em;
  color:#8A929D;margin-top:34px;
}
</style>
</head>
<body>
  <div class="mark">✦</div>
  <p class="code">404</p>
  <h1>找不到這個頁面</h1>
  <p>網址可能輸入錯誤，或頁面已經移除了。<br>請再確認一次收到的連結 🤍</p>
  <footer>MINATO STUDIO</footer>
</body>
</html>
