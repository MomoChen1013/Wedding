<!DOCTYPE html>
<!-- 這個檔案由 scripts/build-og.js 產生，不要手改；改來源請改 public/{index,invitation,shortlink}.html 再重跑 npm run build-og -->
<!-- source: invitation.html 9c8fa390 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 社群預覽文字：爬蟲不跑 JS，一律用不帶樣板的通用文案（見 index.html 的說明）。
     每個站台專屬的那一份由 scripts/build-og.js 產到 public/w/{slug}/invitation.html，
     改了下面幾行要重跑 npm run build-og。 -->
<title>婚禮邀請函｜我們結婚了</title>
<meta name="description" content="誠摯邀請您一起見證我們的大喜之日・時間、地點與出席回覆都在這裡">
<meta property="og:title" content="婚禮邀請函｜我們結婚了">
<meta property="og:description" content="誠摯邀請您一起見證我們的大喜之日・時間、地點與出席回覆都在這裡">
<meta property="og:type" content="website">
<meta property="og:url" content="https://minato-studio-wedding.web.app/w/ginny-one-20260919/invitation">
<meta property="og:image" content="https://minato-studio-wedding.web.app/assets/ginny-one-20260919/og.jpg?v=7dc0916f">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://minato-studio-wedding.web.app/assets/ginny-one-20260919/og.jpg?v=7dc0916f">
<link rel="icon" href="/favicon.png" type="image/png">
<!-- iOS「加到主畫面」用的圖示。同一張 512×512，iOS 會自己縮 -->
<link rel="apple-touch-icon" href="/favicon.png">
<!-- 字體：全站單一字族 Noto Serif TC -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/rsvp.css">
<link rel="stylesheet" href="/css/invitation.css">
</head>
<body data-theme="champagne" data-page="rsvp">

<div class="bg-decor"></div>
<canvas id="fx"></canvas>

<div class="scene-bg" data-bg="gallery"></div>

<section class="panel page-fade" data-panel="rsvp">

  <!-- ============ 封面 ============ -->
  <header class="scene-hero inv-hero">
    <div class="inv-kicker">We're getting married</div>
    <h1 class="sh-title inv-couple">{{couple}}</h1>
    <div class="sh-rule"></div>
    <div class="sh-sub" id="invDate">{{date}}</div>
    <div class="inv-countdown" id="invCountdown"></div>
    <div class="scroll-cue"><span>Scroll</span><span class="arrow"></span></div>
  </header>

  <div class="scene-body">

    <!-- ============ 封面照 ============ -->
    <figure class="inv-cover" id="invCover" hidden>
      <img id="invCoverImg" alt="">
    </figure>

    <!-- ============ 兩人的故事（沒寫就整塊收起來） ============ -->
    <section class="inv-block" id="storyBlock" hidden>
      <div class="section-title">Our Story <small>兩人的故事</small></div>
      <p class="inv-story" id="storyText"></p>
    </section>

    <!-- ============ 婚禮資訊 ============ -->
    <section class="inv-block">
      <div class="section-title">Details <small>婚禮資訊</small></div>
      <div class="cardbox">
        <div class="inv-rows">
          <div class="inv-row">
            <div class="ir-label">日期</div>
            <div class="ir-body"><div class="ir-val" id="detailDate">—</div></div>
          </div>
          <div class="inv-row" id="venueRow" hidden>
            <div class="ir-label">地點</div>
            <div class="ir-body">
              <div class="ir-val" id="venueName"></div>
              <div class="ir-sub" id="venueAddress"></div>
              <a class="ir-jump" id="mapLink" target="_blank" rel="noopener noreferrer" hidden>開啟地圖 →</a>
            </div>
          </div>
          <div class="inv-row" id="dressRow" hidden>
            <div class="ir-label">服裝</div>
            <div class="ir-body"><div class="ir-val inv-note" id="dressCode"></div></div>
          </div>
          <div class="inv-row" id="giftNoteRow" hidden>
            <div class="ir-label">禮金</div>
            <div class="ir-body"><div class="ir-val inv-note" id="giftNote"></div></div>
          </div>
        </div>
        <div class="inv-actions">
          <button class="btn small ghost" id="calBtn" type="button" hidden>加入行事曆</button>
        </div>
      </div>
    </section>

    <!-- ============ 照片牆（沒照片就整塊收起來） ============ -->
    <section class="inv-block" id="galleryBlock" hidden>
      <div class="section-title">Gallery <small>我們的照片</small></div>
      <div class="inv-gallery" id="gallery"></div>
    </section>

    <!-- ============ 出席回覆 ============ -->
    <section class="inv-block" id="rsvpBlock">
      <div class="section-title">R.S.V.P. <small>出席回覆</small></div>
      <p class="inv-lead">花一分鐘告訴我們你的安排，讓我們把每個細節都準備好</p>
      <!-- 題目由 js/rsvp-form.js 依新人在後台的設定產生 -->
      <div id="rsvpFormHost"></div>
    </section>

    <!-- ============ hashtag（沒設定就用預設兩個） ============ -->
    <section class="inv-block" id="tagBlock">
      <div class="inv-tags" id="hashtags"></div>
    </section>

    <footer>made for {{couple}}・小港製作所 設計製作</footer>
  </div>
</section>

<!-- 照片放大 -->
<div class="inv-lightbox" id="lightbox" hidden>
  <button type="button" class="inv-lightbox-close" id="lightboxClose" aria-label="關閉">✕</button>
  <img id="lightboxImg" alt="">
</div>

<!-- 出席回覆表單：先定義好，等 site-context 載完頁面 JS 才會呼叫 -->
<script src="/js/rsvp-form.js"></script>
<!-- 站台載入器：解析 slug、載設定，之後才注入 common.js 與本頁 JS -->
<script type="module" src="/js/site-context.js"></script>
</body>
</html>
