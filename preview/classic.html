<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classic｜大廳模板示範</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo-photo.css">
<style>
/* ============================================================
   Classic — 照片當「整個背景」
   ------------------------------------------------------------
   結構主張：一張 position:fixed 的照片鋪滿視窗，上面壓一層白紗，
   內容是一疊半透明白卡浮在照片上，滾動時照片不動。
   照片是「氛圍」，不是主角 —— 所以它被壓得很淡。
   （＝目前 index.html + index.css 正在做的事）
============================================================ */
:root{
  --ink:#2f2b26; --ink-soft:#7c7267;
  --line:rgba(47,43,38,.18); --line-soft:rgba(47,43,38,.09);
  --primary:#b39a6d; --primary-deep:#8e7748;
  --bg1:#fbfaf7; --bg2:#f4f1ea;
  --radius:2px; --nav-h:54px;
  --f:'Noto Serif TC',serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--f);font-weight:400;color:var(--ink);background:var(--bg1);
  letter-spacing:.03em;line-height:1.8;padding-top:var(--nav-h);overflow-x:hidden;
}
.bg-decor{position:fixed;inset:0;z-index:-2;background:linear-gradient(170deg,var(--bg1),var(--bg2));}

/* ---- 固定背景照 ＋ 白紗 ---- */
.site-bg{position:fixed;inset:0;z-index:-1;}
.site-bg .ph{position:absolute;inset:0;
  background:
    radial-gradient(26% 34% at 41% 58%,rgba(47,43,38,.30),transparent 72%),
    radial-gradient(23% 30% at 58% 62%,rgba(47,43,38,.22),transparent 72%),
    radial-gradient(70% 50% at 30% 18%,rgba(255,253,247,.95),transparent 62%),
    linear-gradient(158deg,#EDE6DA 0%,#DCD3C4 44%,#BCB2A2 76%,#9C9284 100%);
}
.site-bg::after{content:'';position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.78));}

/* ---- 導覽列 ---- */
.site-nav{position:fixed;top:0;left:0;right:0;z-index:950;height:var(--nav-h);
  background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.nav-inner{max-width:1080px;margin:0 auto;height:100%;display:flex;align-items:center;gap:22px;padding:0 18px;}
.nav-brand{font-weight:600;font-size:15px;letter-spacing:.14em;color:var(--ink);text-decoration:none;}
.nav-links{display:flex;gap:22px;overflow-x:auto;}
.nav-link{font-size:13.5px;letter-spacing:.16em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;}

/* ---- Hero：置中，照片在後面 ---- */
.lobby-hero{min-height:calc(100svh - var(--nav-h));display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:18px;padding:60px 20px;}
.hashtags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.tag{font-size:11px;letter-spacing:.24em;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:999px;padding:5px 14px;}
.lobby-hero h1{font-weight:400;font-size:clamp(30px,7vw,58px);line-height:1.3;letter-spacing:.08em;}
.lobby-hero .cn{font-size:clamp(13px,3.2vw,16px);color:var(--ink-soft);letter-spacing:.22em;}
.scroll-cue{display:inline-flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px;
  color:var(--ink-soft);font-size:11px;letter-spacing:.3em;text-transform:uppercase;}
.scroll-cue .arrow{width:1px;height:44px;background:var(--line);}

/* ---- 內容：半透明白卡 ---- */
.scene-body{max-width:820px;margin:0 auto;padding:10px 20px 120px;}
.info-block{padding:44px 32px;margin-top:20px;background:rgba(255,255,255,.7);
  border:1px solid var(--line-soft);border-radius:var(--radius);backdrop-filter:blur(4px);}
.block-title{font-weight:500;font-size:24px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:6px;}
.block-sub{font-size:16px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:28px;}

.info-card{text-align:center;}
.info-couple{font-size:clamp(24px,6vw,34px);letter-spacing:.14em;}
.info-couple-cn{font-size:15px;color:var(--ink-soft);letter-spacing:.2em;margin:6px 0 30px;}
.info-rows{text-align:left;max-width:440px;margin:0 auto;}
.info-row{display:grid;grid-template-columns:4.5em 1fr;gap:16px;align-items:baseline;
  padding:16px 0;border-top:1px solid var(--line-soft);}
.info-row:first-child{border-top:none;}
.ir-label{font-size:11.5px;color:var(--ink-soft);letter-spacing:.24em;}
.ir-val{font-size:15px;}
.ir-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.ir-jump{display:inline-block;margin-top:6px;font-size:12.5px;letter-spacing:.12em;
  color:var(--primary-deep);background:none;border:none;border-bottom:1px solid var(--line);
  padding:0 0 2px;cursor:pointer;font-family:var(--f);}
.info-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px;}
.info-seat{margin-top:30px;padding-top:26px;border-top:1px solid var(--line-soft);display:flex;justify-content:center;}
.info-seat .btn{width:min(100%,320px);}

.btn{font-weight:500;font-size:15px;cursor:pointer;padding:14px 22px;border-radius:var(--radius);
  letter-spacing:.14em;color:#fff;background:var(--ink);border:1px solid var(--ink);
  text-decoration:none;display:inline-block;text-align:center;font-family:var(--f);}
.btn.small{padding:11px 20px;font-size:13.5px;}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}

.timeline{max-width:520px;margin:0 auto;}
.tl-item{display:grid;grid-template-columns:5em 1px 1fr;gap:20px;align-items:start;}
.tl-time{font-size:13px;color:var(--primary-deep);letter-spacing:.1em;text-align:right;padding-top:2px;}
.tl-dot{position:relative;background:var(--line);}
.tl-dot::before{content:'';position:absolute;top:7px;left:50%;transform:translate(-50%,-50%);
  width:5px;height:5px;border-radius:50%;background:var(--ink);}
.tl-item:last-child .tl-dot{height:7px;}
.tl-content{padding-bottom:30px;}
.tl-t{font-size:15px;}
.tl-d{font-size:13px;color:var(--ink-soft);margin-top:4px;}

.note-grid{display:grid;grid-template-columns:1fr 1fr;max-width:640px;margin:0 auto;}
.note-item{padding:0 26px;border-left:1px solid var(--line-soft);}
.note-item:first-child{border-left:none;padding-left:0;}
.note-item:last-child{padding-right:0;}
.note-label{font-size:14px;letter-spacing:.24em;color:var(--ink-soft);margin-bottom:10px;text-transform:uppercase;}
.info-note{line-height:2;font-size:14.5px;white-space:pre-line;}

.story-text{max-width:560px;margin:0 auto;line-height:2.2;font-size:14.5px;white-space:pre-line;}

.cd-card{text-align:center;}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);margin:0 auto;max-width:460px;}
.cd-unit{display:flex;flex-direction:column;gap:8px;padding:20px 6px;border-left:1px solid var(--line-soft);}
.cd-unit:first-child{border-left:none;}
.cd-num{font-weight:300;font-size:clamp(28px,8vw,44px);line-height:1;font-variant-numeric:tabular-nums;}
.cd-lab{font-size:11px;color:var(--ink-soft);letter-spacing:.3em;}
.cd-target{margin-top:20px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.14em;}

.rsvp-cta{text-align:center;padding:6px 0;}
.rsvp-cta h3{font-weight:400;font-size:20px;letter-spacing:.16em;margin-bottom:10px;}
.rsvp-cta p{color:var(--ink-soft);font-size:13.5px;margin-bottom:26px;letter-spacing:.08em;}
.rsvp-cta .btn{padding:14px 34px;}

.link-section{padding:56px 0 0;}
.link-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);}
.link-card{position:relative;display:flex;flex-direction:column;gap:10px;padding:34px 26px 30px;
  text-decoration:none;color:var(--ink);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.9);transition:background .25s,color .25s;}
.link-card:hover{background:var(--ink);color:#fff;}
.lc-index{font-size:11px;letter-spacing:.3em;color:var(--ink-soft);}
.lc-title{font-weight:500;font-size:19px;letter-spacing:.14em;line-height:1.5;}
.lc-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.9;}
.lc-go{margin-top:8px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);}
.lc-flag{position:absolute;right:16px;bottom:16px;width:5px;height:5px;border-radius:50%;background:var(--primary);opacity:.55;}
.link-card:last-child:nth-child(odd){grid-column:1/-1;}

.foot{text-align:center;color:var(--ink-soft);font-size:11.5px;letter-spacing:.2em;
  padding:60px 0 20px;border-top:1px solid var(--line-soft);margin-top:60px;}

@media(max-width:640px){
  .info-block{padding:32px 20px;}
  .note-grid,.link-grid{grid-template-columns:1fr;}
  .note-item{border-left:none;padding:0;}
  .note-item+.note-item{margin-top:28px;padding-top:24px;border-top:1px solid var(--line-soft);}
}
</style>
</head>
<body data-template="classic">

<div class="bg-decor"></div>
<div class="site-bg"><div class="ph"></div></div>

<header class="site-nav"><nav class="nav-inner">
  <a class="nav-brand" href="#" data-field="couple"></a>
  <div class="nav-links">
    <a class="nav-link" href="#">桌次</a><a class="nav-link" href="#">祝福</a>
    <a class="nav-link" href="#">給你的信</a><a class="nav-link" href="#">故事</a>
    <a class="nav-link" href="#">測驗</a><a class="nav-link" href="#">抽卡</a><a class="nav-link" href="#">集氣</a>
  </div>
</nav></header>

<header class="lobby-hero">
  <div class="hashtags">
    <span class="tag">#Ginny和One結婚了</span><span class="tag">#TheOneForGinny</span>
  </div>
  <h1>We're getting married!</h1>
  <div class="cn">點下去出發，一起見證我們的幸福</div>
  <div class="scroll-cue"><span>Scroll</span><span class="arrow"></span></div>
</header>

<div class="scene-body">

  <section class="info-block" data-section="info">
    <div class="block-title">Wedding Info</div>
    <div class="block-sub">大喜之日的所有細節，都在這裡</div>
    <div class="info-card">
      <div class="info-couple" data-field="couple"></div>
      <div class="info-couple-cn" data-field="coupleCn"></div>
      <div class="info-rows">
        <template data-list="info">
          <div class="info-row">
            <div class="ir-label" data-field="label"></div>
            <div class="ir-body">
              <div class="ir-val" data-field="value"></div>
              <div class="ir-sub" data-field="sub"></div>
              <button class="ir-jump" data-field="jump" data-jump="schedule" type="button"></button>
            </div>
          </div>
        </template>
      </div>
      <div class="info-actions">
        <a class="btn small ghost" href="#">開啟地圖</a>
        <a class="btn small ghost" href="#">加入行事曆</a>
      </div>
      <div class="info-seat"><a class="btn" href="#" data-field="seatCta"></a></div>
    </div>
  </section>

  <section class="info-block" data-section="schedule">
    <div class="block-title">Schedule</div>
    <div class="block-sub">當日流程</div>
    <div class="timeline">
      <template data-list="schedule">
        <div class="tl-item">
          <div class="tl-time" data-field="time"></div>
          <div class="tl-dot"></div>
          <div class="tl-content">
            <div class="tl-t" data-field="title"></div>
            <div class="tl-d" data-field="desc"></div>
          </div>
        </div>
      </template>
    </div>
  </section>

  <section class="info-block" data-section="notes">
    <div class="block-title">Just a heads-up</div>
    <div class="block-sub">出席前的小提醒</div>
    <div class="note-grid">
      <template data-list="notes">
        <div class="note-item">
          <div class="note-label" data-field="label"></div>
          <p class="info-note" data-field="text"></p>
        </div>
      </template>
    </div>
  </section>

  <section class="info-block" data-section="transport">
    <div class="block-title">Transport</div>
    <div class="block-sub">交通資訊</div>
    <div class="note-grid">
      <template data-list="transport">
        <div class="note-item">
          <div class="note-label" data-field="label"></div>
          <p class="info-note" data-field="text"></p>
        </div>
      </template>
    </div>
  </section>

  <section class="info-block" data-section="story">
    <div class="block-title">Our Story</div>
    <div class="block-sub">關於我們這一路</div>
    <p class="story-text" data-field="story"></p>
  </section>

  <section class="info-block" data-section="countdown">
    <div class="block-title">Countdown</div>
    <div class="block-sub">距離我們的大日子還有</div>
    <div class="cd-card">
      <div class="cd-grid" data-countdown>
        <template>
          <div class="cd-unit" data-unit>
            <div class="cd-num" data-num></div>
            <div class="cd-lab" data-label></div>
          </div>
        </template>
      </div>
      <div class="cd-target">2026.09.19（星期六）11:30 開始</div>
    </div>
  </section>

  <section class="info-block" data-section="rsvp">
    <div class="rsvp-cta">
      <h3 data-field="rsvp.title"></h3>
      <p data-field="rsvp.lead"></p>
      <a class="btn" href="#" data-field="rsvp.cta"></a>
    </div>
  </section>

  <section class="link-section" data-section="explore">
    <div class="block-title">Explore</div>
    <div class="block-sub">探索其他活動吧！</div>
    <div class="link-grid">
      <template data-list="explore">
        <a class="link-card" href="#">
          <span class="lc-index" data-field="_index"></span>
          <span class="lc-title" data-field="title"></span>
          <span class="lc-sub" data-field="sub"></span>
          <span class="lc-go" data-field="go"></span>
          <span class="lc-flag" data-flag="custom"></span>
        </a>
      </template>
    </div>
  </section>

  <div class="foot" data-field="footer"></div>
</div>

<script src="demo-data.js"></script>
<script src="lobby-mount.js"></script>
</body>
</html>
