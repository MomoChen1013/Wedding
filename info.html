<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💒 婚禮資訊｜Ethan & Momo 婚禮</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/info.css">
</head>
<body data-theme="champagne">

<div class="bg-decor"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="fx"></canvas>

<div class="me-mini" id="meMini"><span class="ic">💍</span><span class="nm">朋友</span></div>

<section class="panel page-fade" data-panel="info">
  <div class="scene-hero">
    <div class="sh-title">💒 Wedding Info</div>
    <div class="sh-sub">大喜之日的所有細節・都在這裡</div>
    <div class="scroll-cue"><span>向下查看</span><span class="arrow">↓</span></div>
  </div>

  <div class="scene-body">

    <!-- ===== 日期倒數 ===== -->
    <div class="cardbox cd-card">
      <div class="section-title"><span class="em">⏳</span> 距離我們的大日子還有</div>
      <div class="cd-grid" id="cdGrid"></div>
      <div class="cd-target" id="cdTarget"></div>
    </div>

    <div class="divider-div"></div>

    <!-- ===== 婚禮資訊卡 ===== -->
    <div class="cardbox info-card">
      <div class="info-couple" id="infoCouple">Ethan &amp; Momo</div>
      <div class="info-couple-cn" id="infoCoupleCn"></div>

      <div class="info-rows">
        <div class="info-row"><span class="ir-ic">📅</span><div class="ir-body"><div class="ir-label">日期</div><div class="ir-val" id="infoDate">—</div></div></div>
        <div class="info-row"><span class="ir-ic">🕛</span><div class="ir-body"><div class="ir-label">時間</div><div class="ir-val" id="infoTime">—</div></div></div>
        <div class="info-row"><span class="ir-ic">📍</span><div class="ir-body"><div class="ir-label">地點</div><div class="ir-val" id="infoVenue">—</div><div class="ir-sub" id="infoAddr"></div></div></div>
      </div>

      <div class="info-actions">
        <a class="btn small" id="mapBtn" href="#" target="_blank" rel="noopener">🗺️ 開啟地圖</a>
        <a class="btn small ghost" id="calBtn" href="#" target="_blank" rel="noopener">📆 加入行事曆</a>
      </div>
    </div>

    <div class="divider-div"></div>

    <!-- ===== 當日流程 ===== -->
    <div class="cardbox">
      <div class="section-title"><span class="em">🗓️</span> 當日流程 <small>大約時間，輕鬆來就好</small></div>
      <div class="timeline" id="schedule"></div>
    </div>

    <div class="divider-div"></div>

    <!-- ===== Dress code / 小提醒 ===== -->
    <div class="cardbox">
      <div class="section-title"><span class="em">👗</span> Dress Code <small>穿搭小提示</small></div>
      <p class="info-note" id="dressCode"></p>
      <div class="section-title"><span class="em">🎁</span> 關於禮金</div>
      <p class="info-note" id="giftNote"></p>
    </div>

    <div class="divider-div"></div>

    <!-- ===== RSVP CTA ===== -->
    <div class="cardbox rsvp-cta">
      <div class="rc-em">✍️</div>
      <h3>能來參加我們的婚禮嗎？</h3>
      <p>花 30 秒回覆出席，讓我們把最好的位置留給你 ♡</p>
      <a class="btn" href="rsvp.html">前往出席回覆 (RSVP) →</a>
    </div>

    <footer>made with ♡ for Ethan & Momo・#EthanMomo2026</footer>
  </div>
</section>

<a class="back-lobby show" href="index.html">回到大廳</a>
<a class="turn-nav show" id="turnLeft"  href="rsvp.html"><span class="tn-arrow">←</span><span class="tn-label">✍️出席回覆</span></a>
<a class="turn-nav show" id="turnRight" href="exhibition.html"><span class="tn-arrow">→</span><span class="tn-label">📸戀愛時光</span></a>

<div class="floating">
  <div class="theme-pop" id="themePop">
    <div class="theme-dot t-champagne" data-theme="champagne" title="香檳金"></div>
    <div class="theme-dot t-blush"   data-theme="blush"   title="霧玫瑰"></div>
    <div class="theme-dot t-sage"      data-theme="sage"      title="鼠尾草綠"></div>
    <div class="theme-dot t-dusk"   data-theme="dusk"   title="霧霾藍"></div>
  </div>
  <button class="fab" id="themeFab" title="換主題色">🎨</button>
  <button class="fab" id="bgmFab"   title="婚禮進行曲">🔇</button>
</div>

<script type="module" src="js/firebase-init.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/info.js"></script>
</body>
</html>
